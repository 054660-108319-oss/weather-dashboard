<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌦️ 實時天氣穿搭預報站</title>
    <link rel="stylesheet" href="./weather-style.css">
</head>
<body>
    <main class="dashboard-container">
        <header class="dashboard-header">
            <p class="eyebrow">WEATHER · OUTFIT GUIDE</p>
            <h1>實時天氣穿搭預報站</h1>
            <p class="dashboard-intro">掌握當下天氣，穿得剛剛好。</p>
        </header>
        
        <div class="search-box" role="search">
            <label class="sr-only" for="cityInput">城市英文名稱</label>
            <input type="text" id="cityInput" placeholder="輸入城市英文名稱（如 Taipei）" autocomplete="off">
            <button id="searchBtn" type="button">查詢天氣 <span aria-hidden="true">→</span></button>
        </div>

        <div id="message" class="message-info" role="status" aria-live="polite" style="display: none;"></div>

        <div id="weatherResult" class="weather-result" style="display: none;">
            <div class="weather-result__topline">
                <p class="result-label">目前天氣</p>
                <p id="cityName">城市名稱</p>
            </div>
            <div class="weather-main">
                <span id="weatherIcon" aria-hidden="true">☀️</span>
                <span id="temperature">-- °C</span>
            </div>
            <p id="weatherDesc">天氣狀況描述</p>
            <p id="humidity">濕度: --%</p>
        </div>

        <hr class="section-divider">

        <div class="outfit-section">
            <h3>🧥 今日穿搭小建議</h3>
            <div id="outfitRecommendation" class="outfit-box">
                請先在上方輸入城市並點擊查詢，獲取專屬穿搭指南！
            </div>
        </div>
    </main>

    <script src="./weather-script.js"></script>
</body>
</html>
